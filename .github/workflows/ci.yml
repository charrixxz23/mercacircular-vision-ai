name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
        working-directory: backend

  frontend:
    name: Frontend (tipos, pruebas y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Imagen Docker (demo en la nube)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mercacircular .
      - name: Arrancar el contenedor y probar la API a través de la interfaz
        run: |
          docker run -d --name mc -p 10000:10000 mercacircular
          for i in $(seq 1 60); do curl -fs http://localhost:10000/api/health && break; sleep 2; done
          curl -fs http://localhost:10000/api/health
          curl -fs http://localhost:10000/ > /dev/null
          curl -fs "http://localhost:10000/api/lots?limit=1" | grep -q MC-D-
      - if: failure()
        run: docker logs mc
